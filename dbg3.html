<!doctype html><meta charset="utf-8"><title>dbg3</title>
<pre id="o">menunggu</pre>
<iframe id="f" style="width:380px;height:700px;border:0"></iframe>
<script>
function hhmm(d){function p(n){return n<10?'0'+n:''+n}return p(d.getHours())+':'+p(d.getMinutes())}
var now=hhmm(new Date());
localStorage.setItem('jam_alarm',JSON.stringify([
  {id:'ujiA',t:now,l:'Uji bunyi',on:true,days:[],v:false,del:false,snd:'bel',sn:0},
  {id:'ujiB',t:now,l:'Uji hapus',on:true,days:[],v:false,del:true,snd:'bip',sn:0}
]));
document.getElementById('f').src='/jam?uji='+Date.now();
setTimeout(function(){
  var out=['menit uji='+now];
  try{
    var fr=document.getElementById('f'),d=fr.contentDocument,w=fr.contentWindow;
    var r=d.getElementById('jRing');
    out.push('ring tampil: '+!!(r&&!r.hidden)+' | judul='+(d.getElementById('jRingT').textContent)+' | isi='+d.getElementById('jRingS').textContent);
    out.push('mdRung='+Object.keys(w.__mdRung||{}).join(','));
    out.push('alarm tersisa: '+localStorage.getItem('jam_alarm'));
  }catch(e){out.push('ERR '+e.message)}
  document.getElementById('o').textContent=out.join('\n');
},3000);
</script>
