<!doctype html><meta charset="utf-8"><title>dbg</title>
<iframe id="f" src="/keuangan" style="width:360px;height:760px;border:0"></iframe>
<pre id="o">menunggu</pre>
<script>
setTimeout(function(){
  try{
    var d=document.getElementById('f').contentDocument;
    var list=d.getElementById('kList');
    var out=['knw='+list.style.getPropertyValue('--knw'),'list client='+list.clientWidth+' scroll='+list.scrollWidth];
    Array.prototype.forEach.call(d.querySelectorAll('#kList .krow'),function(r){
      var n=r.querySelector('.kn');
      out.push('row w='+Math.round(r.getBoundingClientRect().width)+' scrollW='+r.scrollWidth+' | kn w='+Math.round(n.getBoundingClientRect().width)+' scrollW='+n.scrollWidth+' teks="'+n.textContent+'"');
    });
    document.getElementById('o').textContent=out.join('\n');
  }catch(e){document.getElementById('o').textContent='ERR '+e.message}
},4200);
</script>
