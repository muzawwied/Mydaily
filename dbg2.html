<!doctype html><meta charset="utf-8"><title>dbg2</title>
<iframe id="f" src="/jam" style="width:380px;height:700px;border:0"></iframe>
<pre id="o">menunggu</pre>
<script>
setTimeout(function(){
  var out=[];
  try{
    out.push('alarm: '+localStorage.getItem('jam_alarm'));
    var w=document.getElementById('f').contentWindow;
    out.push('mdRung: '+JSON.stringify(w.__mdRung||null));
    out.push('mdRing ada: '+(typeof w.mdRing));
    var d=document.getElementById('f').contentDocument;
    var r=d.getElementById('jRing');
    out.push('jRing parent: '+(r&&r.parentNode&&r.parentNode.tagName)+' hidden='+(r&&r.hidden));
    var rt=d.getElementById('jRingT');
    out.push('jRingT: '+(rt&&rt.textContent)+' | jamSekarang: '+(d.getElementById('jH')?d.getElementById('jH').textContent+':'+d.getElementById('jM').textContent:'?'));
  }catch(e){out.push('ERR '+e.message)}
  document.getElementById('o').textContent=out.join('\n');
},4200);
</script>
